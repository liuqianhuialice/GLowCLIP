seed: 42

model:
  pretrained_name: openai/clip-vit-base-patch16
  image_size: 224
  feature_dim: 256
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_last_n_layers: 4
  gradient_checkpointing: true

data:
  image_root: data/images
  manifest_root: data/manifests
  batch_size: 16
  num_workers: 4
  pin_memory: true
  online_degradation: true

train:
  head_epochs: 1
  joint_epochs: 4
  gradient_accumulation: 2
  head_learning_rate: 0.0005
  lora_learning_rate: 0.0001
  weight_decay: 0.01
  lr_warmup_fraction: 0.08
  consistency_warmup_fraction: 0.10
  lambda_aux: 0.2
  lambda_feature: 0.2
  lambda_prediction: 0.1
  max_grad_norm: 1.0
  precision: bf16
  output_dir: outputs/glowclip
  log_every: 25
  compile: false

evaluation:
  threshold: 0.5
  threshold_strategy: youden
  min_group_samples: 20

