[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glowclip"
version = "0.5.4"
description = "Global-local weighted CLIP feature fusion for robust AI-generated image detection"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["aigc-detection", "clip", "computer-vision", "image-forensics", "robustness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "tensorboard>=2.16,<3",
  "torch>=2.7,<3",
  "tqdm>=4.66,<5",
  "transformers>=4.50,<6",
]

[project.optional-dependencies]
dev = [
  "gradio==6.26.0",
  "huggingface-hub>=1,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
space = [
  "gradio==6.26.0",
  "huggingface-hub>=1,<2",
]

[project.scripts]
glowclip-prepare = "glowclip.prepare:main"
glowclip-normalize-dataset = "glowclip.normalize_dataset:main"
glowclip-train = "glowclip.train:main"
glowclip-evaluate = "glowclip.evaluate:main"
glowclip-predict = "glowclip.predict:main"
glowclip-baseline-reproduction = "glowclip.baselines.runner:main"
glowclip-space = "glowclip.space_app:main"

[tool.setuptools.packages.find]
include = ["glowclip*"]
exclude = ["build*", "data*", "outputs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88
