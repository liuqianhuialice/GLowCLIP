<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">GLowCLIP</title>
  <desc id="desc">Global-local weighted feature fusion for robust AI-generated image detection</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102a43"/>
      <stop offset="1" stop-color="#26144d"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.48" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#f5d0fe" stop-opacity="0.95"/>
      <stop offset="0.32" stop-color="#c084fc" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#7dd3fc" stroke-opacity="0.38" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#background)"/>
  <circle cx="1080" cy="45" r="190" fill="#7c3aed" opacity="0.11"/>
  <circle cx="50" cy="320" r="175" fill="#0ea5e9" opacity="0.09"/>
  <path d="M0 292C245 240 356 334 589 287S947 219 1200 272" fill="none" stroke="#7dd3fc" stroke-opacity="0.08" stroke-width="2"/>

  <g transform="translate(72 72)">
    <text x="0" y="93" fill="url(#wordmark)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="-4">GLowCLIP</text>
    <text x="5" y="137" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5">GLOBAL  •  LOCAL  •  WEIGHTED</text>
    <text x="5" y="187" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">Robust AI-generated image detection with CLIP</text>
  </g>

  <g transform="translate(780 57)">
    <circle cx="158" cy="113" r="112" fill="url(#orb)" opacity="0.52"/>
    <g filter="url(#glow)">
      <circle cx="38" cy="74" r="31" fill="#102a43" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="38" cy="74" r="11" fill="#7dd3fc"/>
      <rect x="7" y="152" width="62" height="62" rx="8" fill="url(#grid)" stroke="#7dd3fc" stroke-width="2"/>
      <path d="M76 74C124 74 119 112 158 112M76 183C124 183 119 123 158 123" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="171" cy="117" r="34" fill="#1e1b4b" stroke="#c084fc" stroke-width="3"/>
      <path d="M160 117l8 8 17-19" fill="none" stroke="#f5d0fe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M207 117h66" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
      <rect x="273" y="87" width="88" height="61" rx="14" fill="#29164f" stroke="#e879f9" stroke-width="3"/>
      <text x="317" y="125" text-anchor="middle" fill="#fae8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">REAL / AI</text>
    </g>
    <text x="38" y="250" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">GLOBAL + LOCAL</text>
    <text x="171" y="250" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">GATE</text>
    <text x="317" y="250" text-anchor="middle" fill="#f0abfc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">DETECT</text>
  </g>
</svg>
